<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a Review | Harris Contracting</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a2418">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg"><link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a2418;--green:#76b82a;--green-2:#8fd23c;--on-green:#101403;--line:rgba(255,255,255,.12)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--ink);color:#faf9f6;min-height:100svh;display:flex;flex-direction:column;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.page-bg{position:fixed;inset:0;z-index:0;background:url('img/hero-telehandler.webp') center/cover;opacity:.13}
nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:1.2rem clamp(20px,5vw,3rem);border-bottom:1px solid var(--line)}
nav img{height:44px;width:auto}
.back{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(250,249,246,.55);transition:color .2s}
.back:hover{color:var(--green-2)}
.back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(2rem,6vw,4rem) 1.25rem}
.card{background:rgba(33,46,31,.82);border:1px solid var(--line);border-radius:20px;padding:clamp(2rem,5vw,3rem) clamp(1.4rem,4vw,2.6rem);max-width:540px;width:100%;text-align:center;backdrop-filter:blur(14px);box-shadow:0 34px 84px rgba(0,0,0,.55)}
h1{font-family:'Outfit';font-weight:800;font-size:clamp(1.9rem,5.4vw,2.6rem);line-height:1.06;letter-spacing:-.02em}
.sub{color:rgba(250,249,246,.7);font-size:1rem;margin-top:.9rem}
.stars{display:flex;justify-content:center;gap:.35rem;margin:2rem 0 .6rem}
.star{background:none;border:0;cursor:pointer;font-size:clamp(2.1rem,8vw,2.9rem);line-height:1;color:rgba(250,249,246,.22);transition:color .18s ease,transform .18s ease;padding:.15rem}
.star:hover,.star.hov,.star.sel{color:var(--green)}
.star:hover{transform:scale(1.14)}
.label{min-height:1.6rem;color:rgba(250,249,246,.55);font-size:.95rem;transition:color .2s}
.label.on{color:var(--green-2)}
.go{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;width:100%;margin-top:1.6rem;min-height:56px;padding:1rem 1.6rem;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(250,249,246,.42);font-family:'Hanken Grotesk';font-weight:700;font-size:1rem;cursor:not-allowed;transition:background .25s,color .25s,transform .2s}
.go.ready{background:var(--green);color:var(--on-green);cursor:pointer}
.go.ready:hover{background:var(--green-2);transform:translateY(-2px)}
.or{display:flex;align-items:center;gap:1rem;margin:1.5rem 0 1.1rem;color:rgba(250,249,246,.32);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.alt{font-size:.9rem;color:rgba(250,249,246,.6);transition:color .2s}
.alt:hover{color:var(--green-2)}
footer{position:relative;z-index:5;text-align:center;padding:1.6rem 1rem 2rem;font-size:.8rem;color:rgba(250,249,246,.34)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>

<nav>
  <a href="index.html" aria-label="Harris Contracting home"><img src="img/logo-white.png" alt="Harris Contracting"></a>
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to site
  </a>
</nav>

<main>
  <div class="card">
    <h1>How did we do?</h1>
    <p class="sub">Pick a rating for the work we did on your place. It takes about ten seconds.</p>

    <div class="stars" id="stars" role="group" aria-label="Star rating">
      <button class="star" data-v="1" aria-label="1 star">&#9733;</button>
      <button class="star" data-v="2" aria-label="2 stars">&#9733;</button>
      <button class="star" data-v="3" aria-label="3 stars">&#9733;</button>
      <button class="star" data-v="4" aria-label="4 stars">&#9733;</button>
      <button class="star" data-v="5" aria-label="5 stars">&#9733;</button>
    </div>

    <div class="label" id="label">Pick a rating above</div>

    <button class="go" id="go" disabled>Continue</button>

    <div class="or">or</div>
    <a class="alt" href="private.html">Send private feedback instead</a>
  </div>
</main>

<footer>&copy; <span id="yr">2026</span> Harris Contracting &middot; Tinwald, Ashburton</footer>

<script>
var GOOGLE_REVIEW_URL='https://www.google.com/maps/search/?api=1&query=Harris%20Contracting%2C%20Tinwald%2C%20Ashburton';

var labels={
  1:'Sorry to hear that. Tell us what went wrong.',
  2:'Not good enough. We would like to hear more.',
  3:'Thanks. Tell us what we could have done better.',
  4:'Good to hear. Mind putting that on Google?',
  5:'Great. A quick Google review really helps us.'
};
var stars=document.querySelectorAll('.star');
var label=document.getElementById('label');
var go=document.getElementById('go');
var picked=0;

stars.forEach(function(s){
  s.addEventListener('mouseenter',function(){
    var v=+s.dataset.v;
    stars.forEach(function(x){x.classList.toggle('hov',+x.dataset.v<=v)});
    label.textContent=labels[v];label.classList.add('on');
  });
  s.addEventListener('mouseleave',function(){
    stars.forEach(function(x){x.classList.remove('hov')});
    label.textContent=picked?labels[picked]:'Pick a rating above';
    label.classList.toggle('on',!!picked);
  });
  s.addEventListener('click',function(){
    picked=+s.dataset.v;
    stars.forEach(function(x){x.classList.toggle('sel',+x.dataset.v<=picked)});
    label.textContent=labels[picked];label.classList.add('on');
    go.classList.add('ready');go.disabled=false;
    go.textContent=picked>=4?'Leave a Google review':'Tell us what happened';
  });
});

go.addEventListener('click',function(){
  if(!picked)return;
  if(picked>=4){window.open(GOOGLE_REVIEW_URL,'_blank','noopener');}
  else{window.location.href='private.html?rating='+picked;}
});

document.getElementById('yr').textContent=(new Date()).getFullYear();
</script>
</body>
</html>
